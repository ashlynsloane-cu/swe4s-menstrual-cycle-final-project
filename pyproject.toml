[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-average-cycle"
version = "0.2.0"
description = "Reproducible analysis tools for person-specific menstrual-cycle physiology using mcPHASES."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "bambi>=0.21,<0.22",
    "pymc>=6.3,<7",
    "pytensor>=3.3,<4",
    "arviz>=1.3,<2",
    "h5netcdf>=1.4,<2",
    "h5py>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pycodestyle>=2.14,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
