name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile analysis and review scripts
        run: python -m py_compile scripts/aim1/*.py scripts/aim2/*.py scripts/review/*.py

      - name: Check style
        run: python -m pycodestyle src tests scripts/aim1/*.py scripts/aim2/*.py scripts/review/*.py

      - name: Run tests
        run: pytest -q
